[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "severino-vault-engine"
version = "1.0.0"
description = "Domain-agnostic vault-governance engine: frontmatter schema profiles, indexing, ranked search, a task ledger, atomic writes, and a composable MCP core (register_core). The reusable core behind severino-vault-mcp and severino-edu-mcp."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joe Severino", email = "github@jseverino.com" }]
maintainers = [{ name = "Joe Severino", email = "github@jseverino.com" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "obsidian",
    "frontmatter",
    "local-first",
    "vault",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
# No runtime dependencies: register_core takes the server's FastMCP (mcp 1.x)
# instance, so each server pins mcp itself.
dependencies = []

[project.optional-dependencies]
# cordon's Python reference emitter backs the `describe` MCP tool only, and it's
# a lazy import — the engine installs and imports fine without it, so it's an
# extra rather than a hard dependency (cordon-emit is git-only, not on PyPI). A
# server that exposes describe (e.g. severino-vault-mcp) pulls cordon-emit itself.
describe = ["cordon-emit"]
dev = [
    "mypy>=2,<3",
    "pytest>=9,<10",
    "ruff>=0.16,<0.17",
]

[project.urls]
Homepage = "https://github.com/joeseverino/vault-engine"
Repository = "https://github.com/joeseverino/vault-engine"
Issues = "https://github.com/joeseverino/vault-engine/issues"
Changelog = "https://github.com/joeseverino/vault-engine/blob/main/CHANGELOG.md"
Documentation = "https://github.com/joeseverino/vault-engine/blob/main/README.md"

[tool.uv.sources]
cordon-emit = { git = "https://github.com/joeseverino/cordon", subdirectory = "emitters/python" }

[tool.hatch.build.targets.wheel]
packages = ["src/vault_engine"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "SIM", "PTH", "C4", "PERF", "RUF", "FURB",
    "DTZ", "ASYNC", "T20", "S",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
"src/vault_engine/doctor.py" = ["T20"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["mcp.*", "cordon_emit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["src"]
filterwarnings = ["error"]
xfail_strict = true
