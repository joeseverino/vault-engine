name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The whole CI surface is cordon's reusable gate: it runs the checks engine
  # over this repo, auto-detecting the uv stack and running ruff, pytest
  # (across the Python versions in [project].classifiers), version alignment,
  # and the built-wheel import smoke — folded with cordon's repo invariants
  # into one verdict. The bespoke ruff/pytest matrix this file used to carry
  # is what the gate replaces; all CI plumbing lives once in cordon. Locally
  # the same gate is scripts/check.sh. The single required check: `cordon / gate`.
  cordon:
    uses: joeseverino/cordon/.github/workflows/cordon-gate.yml@main
